summary: Criar resíduo especial
description: Cadastra um resíduo especial associado a um veículo.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        veiculo_id:
          type: integer
        nome:
          type: string
        quantidade:
          type: number
          format: float
        unidade:
          type: string
        destino:
          type: string
responses:
  201:
    description: Resíduo especial criado com sucesso.
  400:
    description: Erro ao criar resíduo especial.
