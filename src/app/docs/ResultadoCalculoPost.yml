summary: Criar resultado de cálculo
description: Cadastra um resultado de cálculo de emissões.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        veiculo_id:
          type: integer
        cenario:
          type: string
          default: base
        etapa:
          type: string
        emissao_kgco2e:
          type: number
          format: float
        participacao_pct:
          type: number
          format: float
        evitado_kgco2e:
          type: number
          format: float
responses:
  201:
    description: Resultado de cálculo criado com sucesso.
  400:
    description: Erro ao criar resultado de cálculo.
