summary: Criar fator de material virgem
description: Cadastra os fatores relacionados ao material virgem.
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      properties:
        material_id:
          type: integer
        fe_virgem:
          type: number
          format: float
        fd:
          type: number
          format: float
responses:
  201:
    description: Fator de material virgem criado com sucesso.
  400:
    description: Erro ao criar fator de material virgem.
