<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR gerado</title>
</head>
<body>
    <h1>QR #{{ qr_id }}</h1>
    <p>Arquivo no banco: <code>{{ path }}</code></p>
    <p>Arquivo existe no disco: {{ 'sim' if existe else 'não' }}</p>
    <p>Link do download: <a href="{{ link }}">{{ link }}</a></p>
</body>
</html>
