tags:
- Veículos
summary: Edita um veículo
consumes: &id001
- application/json
produces: *id001
parameters:
- name: veiculo_id
  in: path
  required: true
  type: integer
  description: ID do veículo
- name: body
  in: body
  required: true
  description: Envie só os campos que quer alterar. Chassi vazio é ignorado.
  schema:
    type: object
    properties:
      veiculo:
        type: string
        example: Carro
      modelo:
        type: string
        example: Gol 1.0
      ano:
        type: integer
        example: 2012
      categoria:
        type: string
        example: Passeio
      massa_total_kg:
        type: number
        example: 980.5
      vida_util_anos:
        type: number
        example: 15
      quilometragem_km:
        type: number
        example: 180000
      estado:
        type: string
        example: Fim de vida
        default: Fim de vida
      chassi:
        type: string
        example: 9BWZZZ377VT004251
responses:
  200:
    description: Veículo atualizado
    schema:
      type: object
      properties:
        id:
          type: integer
  400:
    description: 'Dados inválidos (ex.: chassi repetido)'
    schema: &id002
      type: object
      properties:
        erro:
          type: string
  404:
    description: Veículo não encontrado
    schema: *id002
